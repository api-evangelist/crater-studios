aid: crater-studios
name: Crater Studios
description: Crater Studios is an AI-native game studio that builds core AI systems for game design,
  decision making, and live operations, trained on real player behavior in production environments.
  The company uses its own live game launches as production laboratories, shipping titles such as
  Dwarven Realms, Gravebound, and Doomspire on Steam while building agentic tooling around them -
  a GDD Maker that turns raw concepts into production-ready game design documents, a conversational
  decision engine wired to live telemetry, automated playtesting agents, content moderation, and
  localization. Crater publishes a set of playable browser prototypes on craterstudios.ai subdomains
  as proof that its design agents can produce working core loops. Surfaced as an a16z portfolio
  company. As of this enrichment pass Crater Studios publishes no public API, developer portal,
  documentation, SDKs, or machine-readable specification - its AI systems are internal platform
  infrastructure rather than a developer product.
